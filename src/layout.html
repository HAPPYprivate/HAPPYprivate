<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020005" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}" />
  <link rel="canonical" href="{{CANON}}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESC}}" />
  <meta property="og:url" content="{{CANON}}" />
  <meta property="og:image" content="{{SITE}}logo.png" />
  <meta name="twitter:card" content="summary" />

  <style id="swarm-first-paint-style">
    :root { --swarm-cover-bg: #020005; }
    html[data-swarm-init="true"]::before { content: ""; position: fixed; inset: 0; z-index: 2147483640; background: var(--swarm-cover-bg, #020005); }
  </style>
  <script id="swarm-first-paint-init">
    (() => {
      try {
        const builtPaths = JSON.parse(sessionStorage.getItem("portfolio-built-paths-v1") || "[]");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const alreadyBuilt = Array.isArray(builtPaths) && builtPaths.includes(window.location.pathname);
        if (!reducedMotion && !alreadyBuilt) {
          document.documentElement.setAttribute("data-swarm-init", "true");
          document.documentElement.setAttribute("data-swarm-building", "true");
          document.documentElement.setAttribute("data-swarm-run", "true");
        }
      } catch (error) { /* storage unavailable: leave the normal page visible */ }
    })();
  </script>
  <link rel="preload" href="{{BASE}}assets/swarm-engine.js" as="script" />
  <link rel="icon" href="{{BASE}}logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{BASE}}assets/site.css" />
</head>
<body data-route="{{ROUTE}}">
  <div class="ambient-bg" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <header class="nav">
    <div class="wrap nav-in">
      <a class="nav-brand" href="{{HOME}}" aria-label="HAPPY home"><img src="{{BASE}}logo.png" alt="" width="32" height="32" /><span>HAPPY</span></a>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Menu"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
      <nav class="nav-links" id="navLinks" aria-label="Main">
        {{NAV}}
        <a href="#faq">FAQ</a>
        <a href="#community">Community</a>
      </nav>
    </div>
  </header>

  <main>
{{SECTIONS}}
  </main>

  <div id="toast" class="cyber-toast" role="status" aria-live="polite" aria-atomic="true">
    <i class="fa-solid fa-check" id="toastIcon" style="color: var(--neon-cyan)" aria-hidden="true"></i>
    <span id="toastText">Script copied to clipboard.</span>
  </div>

  <script id="scriptContent" type="text/plain">loadstring(game:HttpGet("https://happyscript.happy37135535.workers.dev/"))()</script>
  <script src="{{BASE}}assets/site-config.js"></script>
  <script src="{{BASE}}assets/site.js" defer></script>

  <!-- Swarm cursor animation. Path is resolved from the page's base so it works on / and /midi/. -->
  <script id="swarm-engine-loader">
    (() => {
      "use strict";
      const root = document.documentElement;
      if (root.getAttribute("data-swarm-init") !== "true") return;
      window.__swarmConfig = Object.freeze({ minAgents: 4, maxAgents: 20, introAgents: 10, flockAgents: 12, idleRetireMs: 1800, scrollBoostStep: 160, scrollBoostMax: 4 });
      window.__swarmModels = [
        { name: "HAPPY Core", color: "#9d4edd" }, { name: "HAPPY Script", color: "#ff2a85" },
        { name: "HAPPY Midi", color: "#7c5cff" }, { name: "GPT", color: "#00f5d4" },
        { name: "Claude", color: "#bd5cff" }, { name: "Gemini", color: "#00b4d8" }
      ];
      let failsafe = 0;
      function releaseCover() {
        window.clearTimeout(failsafe);
        root.removeAttribute("data-swarm-init");
        root.removeAttribute("data-swarm-building");
      }
      failsafe = window.setTimeout(() => {
        if (root.getAttribute("data-swarm-init") !== "true") return;
        const swarm = window.__swarmRebuild;
        if (swarm?.app && typeof swarm.stop === "function") { try { swarm.stop(false); } catch (e) { console.error("[HAPPY] Could not stop Swarm:", e); } }
        console.warn("[HAPPY] Swarm startup timed out; showing the original page.");
        releaseCover();
      }, 12000);
      async function loadSwarm() {
        if (root.getAttribute("data-swarm-init") !== "true") return;
        try { await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))]); } catch (e) {}
        if (root.getAttribute("data-swarm-init") !== "true") return;
        const engine = document.createElement("script");
        engine.src = new URL("{{BASE}}assets/swarm-engine.js", document.baseURI).href;
        engine.async = true;
        engine.onload = () => {
          if (root.getAttribute("data-swarm-init") !== "true") return;
          const swarm = window.__swarmRebuild;
          if (swarm && typeof swarm.start === "function") {
            try { swarm.start(); } catch (e) { console.error("[HAPPY] Swarm startup failed:", e); releaseCover(); }
          } else { console.error("[HAPPY] Swarm engine loaded, but start() was not found."); releaseCover(); }
        };
        engine.onerror = () => { console.error("[HAPPY] Could not load assets/swarm-engine.js."); releaseCover(); };
        document.head.appendChild(engine);
      }
      if (document.readyState === "complete") loadSwarm(); else window.addEventListener("load", loadSwarm, { once: true });
    })();
  </script>
</body>
</html>
